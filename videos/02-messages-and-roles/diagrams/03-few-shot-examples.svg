<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="400" fill="#FFFFFF"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Show, don't tell: few-shot examples</text>

  <!-- Panels -->
  <rect x="15" y="56" width="400" height="300" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="435" y="56" width="510" height="300" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2"/>
  <text x="215" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Without examples</text>
  <text x="690" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">With 2 examples</text>

  <!-- Left -->
  <rect x="35" y="104" width="360" height="44" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="50" y="131" font-size="12" fill="#111827">user: Turn this into a ticket: export button broken...</text>
  <rect x="35" y="160" width="360" height="130" rx="10" fill="#FFF1EE" stroke="#FF3621" stroke-width="2"/>
  <g font-size="12" fill="#374151">
    <text x="50" y="184">assistant: Here is a ticket based on the issue</text>
    <text x="50" y="202">you provided: **Ticket Title:** Export Button</text>
    <text x="50" y="220">Not Functioning on Mobile Devices</text>
    <text x="50" y="238">**Description:** The export button is currently</text>
    <text x="50" y="256">not working on mobile devices, resulting in...</text>
    <text x="50" y="274">(and much more)</text>
  </g>
  <text x="215" y="330" text-anchor="middle" font-size="13" fill="#6B7280">Long, and a different format every time.</text>

  <!-- Right -->
  <g font-size="12" font-family="Menlo, Consolas, monospace" fill="#111827">
    <rect x="455" y="104" width="470" height="28" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="467" y="123">user:      the login page takes forever to load</text>
    <rect x="455" y="138" width="470" height="28" rx="8" fill="#FFF1EE" stroke="#FF3621" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="467" y="157">assistant: [PERF] Login page slow | priority: medium</text>
    <rect x="455" y="176" width="470" height="28" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="467" y="195">user:      I was charged twice for my subscription</text>
    <rect x="455" y="210" width="470" height="28" rx="8" fill="#FFF1EE" stroke="#FF3621" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="467" y="229">assistant: [BILLING] Duplicate charge | priority: high</text>
    <rect x="455" y="252" width="470" height="28" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="467" y="271">user:      export button broken on mobile...</text>
    <rect x="455" y="288" width="470" height="30" rx="8" fill="#FFF1EE" stroke="#FF3621" stroke-width="3"/>
    <text x="467" y="308" font-weight="bold">model:     [MOBILE] Export button broken | priority: high</text>
  </g>
  <text x="905" y="150" text-anchor="end" font-size="11" fill="#6B7280"> </text>
  <text x="690" y="340" text-anchor="middle" font-size="13" fill="#6B7280">Dashed = example answers YOU wrote. The model copies the pattern.</text>

  <text x="480" y="384" text-anchor="middle" font-size="14" fill="#374151">You can write assistant messages yourself to teach the model a format.</text>
</svg>
