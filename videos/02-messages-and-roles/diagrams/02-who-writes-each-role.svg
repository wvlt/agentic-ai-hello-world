<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="380" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Who writes each role?</text>

  <!-- Header -->
  <g font-size="13" font-weight="bold" fill="#6B7280">
    <text x="40" y="78">ROLE</text>
    <text x="240" y="78">WHO WRITES IT</text>
    <text x="470" y="78">WHAT IT IS FOR</text>
    <text x="790" y="78">VIDEO</text>
  </g>
  <line x1="30" y1="88" x2="870" y2="88" stroke="#E5E7EB" stroke-width="2"/>

  <!-- system -->
  <rect x="30" y="102" width="180" height="44" rx="22" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3"/>
  <text x="120" y="122" text-anchor="middle" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">system</text>
  <text x="120" y="139" text-anchor="middle" font-size="11" fill="#6B7280">(newer name: developer)</text>
  <text x="240" y="129" font-size="14" fill="#111827">You, the developer</text>
  <text x="470" y="129" font-size="14" fill="#374151">Rules, personality, goals</text>
  <text x="790" y="129" font-size="14" fill="#374151">02</text>

  <!-- user -->
  <rect x="30" y="162" width="180" height="44" rx="22" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/>
  <text x="120" y="190" text-anchor="middle" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">user</text>
  <text x="240" y="189" font-size="14" fill="#111827">The person using your app</text>
  <text x="470" y="189" font-size="14" fill="#374151">Questions and instructions</text>
  <text x="790" y="189" font-size="14" fill="#374151">01, 02</text>

  <!-- assistant -->
  <rect x="30" y="222" width="180" height="44" rx="22" fill="#FFF1EE" stroke="#FF3621" stroke-width="3"/>
  <text x="120" y="250" text-anchor="middle" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">assistant</text>
  <text x="240" y="242" font-size="14" fill="#111827">The model</text>
  <text x="240" y="259" font-size="12" fill="#6B7280">...or you, to write examples</text>
  <text x="470" y="242" font-size="14" fill="#374151">Replies</text>
  <text x="470" y="259" font-size="12" fill="#6B7280">and example answers (few-shot)</text>
  <text x="790" y="249" font-size="14" fill="#374151">02, 04</text>

  <!-- tool (later) -->
  <g opacity="0.45">
    <rect x="30" y="282" width="180" height="44" rx="22" fill="#ECFDF5" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="120" y="310" text-anchor="middle" font-size="15" font-weight="bold" font-family="Menlo, Consolas, monospace" fill="#111827">tool</text>
    <text x="240" y="309" font-size="14" fill="#111827">Your Python code</text>
    <text x="470" y="309" font-size="14" fill="#374151">Results of functions the model asked for</text>
    <text x="790" y="309" font-size="14" fill="#374151">06</text>
  </g>

  <text x="450" y="360" text-anchor="middle" font-size="14" fill="#374151">Today: system, user, assistant. The tool role arrives in Video 06.</text>
</svg>
