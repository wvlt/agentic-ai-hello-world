<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="400" fill="#FFFFFF"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Context engineering: what goes into the window</text>
  <text x="470" y="58" text-anchor="middle" font-size="14" fill="#374151">"How much did customer 42 spend in March 2026, not counting cancelled orders?"</text>

  <!-- Big tool -->
  <text x="40" y="96" font-size="14" font-weight="bold" fill="#111827">get_all_orders()  - all 400 orders, every field</text>
  <rect x="40" y="106" width="18" height="36" fill="#9CA3AF"/>
  <rect x="58" y="106" width="662" height="36" fill="#FB923C"/>
  <text x="389" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">tool result: about 30,000 tokens</text>
  <text x="732" y="130" font-size="14" font-weight="bold" fill="#111827">31,019 tokens</text>
  <text x="40" y="166" font-size="13" fill="#B91C1C">Llama 3.3, 2 runs: $781.45, $872.28 - both WRONG</text>
  <text x="420" y="166" font-size="13" fill="#B91C1C">Claude Haiku, 2 runs: $2,223.40, then $2,623.37 (wrong)</text>

  <!-- Narrow tool -->
  <text x="40" y="214" font-size="14" font-weight="bold" fill="#111827">get_order_total(customer_id=42, month="2026-03")  - one small result</text>
  <rect x="40" y="224" width="16" height="36" fill="#9CA3AF"/>
  <rect x="56" y="224" width="3" height="36" fill="#FB923C"/>
  <text x="70" y="248" font-size="14" font-weight="bold" fill="#111827">824 tokens</text>
  <text x="40" y="284" font-size="13" fill="#047857">Llama 3.3 and Claude Haiku, every run: $2,223.40 - correct (Python did the adding)</text>

  <!-- Legend -->
  <g font-size="12" fill="#374151">
    <rect x="40" y="306" width="14" height="14" fill="#9CA3AF"/><text x="60" y="318">system + question + tool menu</text>
    <rect x="260" y="306" width="14" height="14" fill="#FB923C"/><text x="280" y="318">tool result</text>
    <text x="400" y="318" fill="#9CA3AF">Input tokens of the second call, Llama 3.3, our test.</text>
  </g>

  <text x="470" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Do the work in code. Give the model only what it needs.</text>
  <text x="470" y="384" text-anchor="middle" font-size="13" fill="#374151">About 38x fewer tokens - and right on both models.</text>
</svg>
