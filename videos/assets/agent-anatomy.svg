<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="Helvetica, Arial, sans-serif">
  <!-- The running picture of the series: every video lights up the part it adds. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#FFFFFF"/>

  <!-- Guardrails: the seatbelt around everything -->
  <rect x="10" y="14" width="780" height="446" rx="18" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="28" y="40" font-size="14" font-weight="bold" fill="#6B7280">Guardrails (the seatbelt): limits, checks, stops</text>

  <!-- You / goal -->
  <rect x="30" y="205" width="140" height="70" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="100" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">You</text>
  <text x="100" y="256" text-anchor="middle" font-size="13" fill="#374151">a goal or question</text>

  <!-- LLM / brain -->
  <circle cx="400" cy="240" r="85" fill="#FFF1EE" stroke="#FF3621" stroke-width="4"/>
  <text x="400" y="228" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">LLM</text>
  <text x="400" y="250" text-anchor="middle" font-size="14" fill="#374151">the brain</text>
  <text x="400" y="270" text-anchor="middle" font-size="13" fill="#6B7280">reads &amp; decides</text>

  <!-- Memory -->
  <rect x="325" y="62" width="150" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/>
  <text x="400" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Memory</text>
  <text x="400" y="110" text-anchor="middle" font-size="13" fill="#374151">the notebook</text>
  <text x="400" y="126" text-anchor="middle" font-size="12" fill="#6B7280">what it can see now</text>

  <!-- Tools -->
  <rect x="620" y="205" width="150" height="70" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <text x="695" y="233" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Tools</text>
  <text x="695" y="253" text-anchor="middle" font-size="13" fill="#374151">the hands</text>
  <text x="695" y="269" text-anchor="middle" font-size="12" fill="#6B7280">act on the world</text>

  <!-- Final answer -->
  <rect x="325" y="380" width="150" height="50" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="400" y="411" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Final answer</text>

  <!-- Arrows -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <line x1="170" y1="240" x2="312" y2="240" marker-end="url(#arrow)"/>
    <line x1="485" y1="240" x2="617" y2="240" marker-end="url(#arrow)"/>
    <path d="M695 205 C695 120 560 97 478 97" marker-end="url(#arrow)"/>
    <line x1="400" y1="132" x2="400" y2="152" marker-end="url(#arrow)"/>
    <line x1="400" y1="325" x2="400" y2="377" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#374151">
    <text x="551" y="230" text-anchor="middle">1. decide to act</text>
    <text x="640" y="118" text-anchor="middle">2. result is saved</text>
    <text x="412" y="148">3. read it</text>
    <text x="412" y="357">when done</text>
  </g>

  <!-- The loop -->
  <text x="600" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B">the LOOP: repeat 1-2-3 until done</text>
</svg>
