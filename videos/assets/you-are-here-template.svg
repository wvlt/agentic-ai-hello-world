<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="Helvetica, Arial, sans-serif">
  <!-- Master course map. Copy into each video folder and highlight that video's node (see 01-what-is-an-agent/you-are-here.svg). -->
  <rect width="1040" height="400" fill="#FFFFFF"/>
  <text x="520" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Agentic AI Hello World - Course Map</text>

  <!-- Road -->
  <path d="M80 130 H920 A75 75 0 0 1 920 280 H220" fill="none" stroke="#D1D5DB" stroke-width="6" stroke-linecap="round"/>

  <!-- Foundations (blue) -->
  <g font-size="13" fill="#374151" text-anchor="middle">
    <circle cx="80" cy="130" r="24" fill="#F9FAFB" stroke="#3B82F6" stroke-width="4"/>
    <text x="80" y="136" font-size="16" font-weight="bold">1</text>
    <text x="80" y="180">What is an agent?</text>

    <circle cx="220" cy="130" r="24" fill="#F9FAFB" stroke="#3B82F6" stroke-width="4"/>
    <text x="220" y="136" font-size="16" font-weight="bold">2</text>
    <text x="220" y="180">Messages &amp; roles</text>

    <circle cx="360" cy="130" r="24" fill="#F9FAFB" stroke="#3B82F6" stroke-width="4"/>
    <text x="360" y="136" font-size="16" font-weight="bold">3</text>
    <text x="360" y="180">Reading the reply</text>

    <circle cx="500" cy="130" r="24" fill="#F9FAFB" stroke="#3B82F6" stroke-width="4"/>
    <text x="500" y="136" font-size="16" font-weight="bold">4</text>
    <text x="500" y="180">No memory</text>

    <circle cx="640" cy="130" r="24" fill="#F9FAFB" stroke="#3B82F6" stroke-width="4"/>
    <text x="640" y="136" font-size="16" font-weight="bold">5</text>
    <text x="640" y="180">JSON answers</text>

    <!-- Tools (green) -->
    <circle cx="780" cy="130" r="24" fill="#F9FAFB" stroke="#10B981" stroke-width="4"/>
    <text x="780" y="136" font-size="16" font-weight="bold">6</text>
    <text x="780" y="180">First tool</text>

    <circle cx="920" cy="130" r="24" fill="#F9FAFB" stroke="#10B981" stroke-width="4"/>
    <text x="920" y="136" font-size="16" font-weight="bold">7</text>
    <text x="920" y="180">Tool rules</text>

    <!-- The agent (amber) -->
    <circle cx="920" cy="280" r="24" fill="#F9FAFB" stroke="#F59E0B" stroke-width="4"/>
    <text x="920" y="286" font-size="16" font-weight="bold">8</text>
    <text x="920" y="330">Agent loop</text>

    <circle cx="780" cy="280" r="24" fill="#F9FAFB" stroke="#F59E0B" stroke-width="4"/>
    <text x="780" y="286" font-size="16" font-weight="bold">9</text>
    <text x="780" y="330">Safe agents</text>

    <!-- Production (purple) -->
    <circle cx="640" cy="280" r="24" fill="#F9FAFB" stroke="#8B5CF6" stroke-width="4"/>
    <text x="640" y="286" font-size="16" font-weight="bold">10</text>
    <text x="640" y="330">Tracing</text>

    <circle cx="500" cy="280" r="24" fill="#F9FAFB" stroke="#8B5CF6" stroke-width="4"/>
    <text x="500" y="286" font-size="16" font-weight="bold">11</text>
    <text x="500" y="330">Real data</text>

    <circle cx="360" cy="280" r="24" fill="#F9FAFB" stroke="#8B5CF6" stroke-width="4"/>
    <text x="360" y="286" font-size="16" font-weight="bold">12</text>
    <text x="360" y="330">Evaluation</text>

    <circle cx="220" cy="280" r="24" fill="#F9FAFB" stroke="#8B5CF6" stroke-width="4"/>
    <text x="220" y="286" font-size="16" font-weight="bold">13</text>
    <text x="220" y="330">To production</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#374151">
    <rect x="200" y="364" width="14" height="14" rx="3" fill="#3B82F6"/><text x="220" y="376">Foundations (1-5)</text>
    <rect x="370" y="364" width="14" height="14" rx="3" fill="#10B981"/><text x="390" y="376">Tools (6-7)</text>
    <rect x="500" y="364" width="14" height="14" rx="3" fill="#F59E0B"/><text x="520" y="376">The agent (8-9)</text>
    <rect x="650" y="364" width="14" height="14" rx="3" fill="#8B5CF6"/><text x="670" y="376">Production (10-13)</text>
  </g>
</svg>
