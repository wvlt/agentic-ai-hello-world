<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="940" height="470" fill="#FFFFFF"/>
  <text x="470" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">The tool-call dance (one round)</text>

  <!-- Lane headers -->
  <rect x="40" y="48" width="220" height="40" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <text x="150" y="73" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Your Python function</text>
  <rect x="380" y="48" width="180" height="40" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/>
  <text x="470" y="73" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Your code</text>
  <rect x="700" y="48" width="180" height="40" rx="10" fill="#FFF1EE" stroke="#FF3621" stroke-width="3"/>
  <text x="790" y="73" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">LLM</text>

  <!-- Lifelines -->
  <g stroke="#D1D5DB" stroke-width="2" stroke-dasharray="6 5">
    <line x1="150" y1="88" x2="150" y2="420"/>
    <line x1="470" y1="88" x2="470" y2="420"/>
    <line x1="790" y1="88" x2="790" y2="420"/>
  </g>

  <!-- Steps -->
  <g stroke="#374151" stroke-width="2.5">
    <line x1="474" y1="125" x2="784" y2="125" marker-end="url(#arrow)"/>
    <line x1="786" y1="180" x2="476" y2="180" marker-end="url(#arrow)"/>
    <line x1="466" y1="235" x2="156" y2="235" marker-end="url(#arrow)"/>
    <line x1="154" y1="285" x2="464" y2="285" marker-end="url(#arrow)"/>
    <line x1="474" y1="340" x2="784" y2="340" marker-end="url(#arrow)"/>
    <line x1="786" y1="395" x2="476" y2="395" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#111827">
    <text x="630" y="116"><tspan font-weight="bold">1.</tspan> question + tool menu</text>
    <text x="630" y="171"><tspan font-weight="bold">2.</tspan> tool_call: multiply(a=48729, b=3817)</text>
    <text x="630" y="198" font-size="11" fill="#6B7280">finish_reason = "tool_calls", content = None</text>
    <text x="310" y="226"><tspan font-weight="bold">3.</tspan> YOU run multiply(48729, 3817)</text>
    <text x="310" y="276"><tspan font-weight="bold">4.</tspan> returns 185998593</text>
    <text x="630" y="331"><tspan font-weight="bold">5.</tspan> send the result back</text>
    <text x="630" y="358" font-size="11" fill="#6B7280">role "tool" + the matching tool_call_id</text>
    <text x="630" y="386"><tspan font-weight="bold">6.</tspan> "The answer is 185,998,593"</text>
  </g>

  <text x="470" y="452" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">The model never runs your code. It only asks - you run it.</text>
</svg>
