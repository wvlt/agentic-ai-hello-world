<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="940" height="400" fill="#FFFFFF"/>
  <text x="470" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Valid JSON is not the same as correct JSON</text>

  <!-- Message -->
  <rect x="60" y="52" width="820" height="40" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="470" y="77" text-anchor="middle" font-size="14" fill="#111827">"Hi, this is Priya. Can I book a table for 4 people this Friday?"   (no time given)</text>

  <!-- Outputs -->
  <rect x="60" y="114" width="390" height="72" rx="10" fill="#FFF1EE" stroke="#FF3621" stroke-width="2"/>
  <text x="76" y="138" font-size="12" font-weight="bold" fill="#6B7280">LLAMA 3.3 (time must be a string)</text>
  <text x="76" y="166" font-size="14" font-family="Menlo, Consolas, monospace" fill="#111827">"time": "null"</text>
  <rect x="490" y="114" width="390" height="72" rx="10" fill="#FFF1EE" stroke="#FF3621" stroke-width="2"/>
  <text x="506" y="138" font-size="12" font-weight="bold" fill="#6B7280">CLAUDE HAIKU (even when null is allowed)</text>
  <text x="506" y="166" font-size="14" font-family="Menlo, Consolas, monospace" fill="#111827">"time": "&lt;UNKNOWN&gt;"</text>

  <!-- Trap -->
  <rect x="190" y="210" width="560" height="64" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="210" y="238" font-size="14" font-family="Menlo, Consolas, monospace" fill="#111827">if booking["time"]:   # True!</text>
  <text x="210" y="260" font-size="13" font-weight="bold" fill="#B91C1C">Both are non-empty strings, so the code thinks it has a time.</text>

  <!-- Fix -->
  <rect x="130" y="300" width="680" height="64" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="150" y="326" font-size="14" font-weight="bold" fill="#047857">Fix: check the values in code</text>
  <text x="150" y="348" font-size="13" fill="#374151">clean() turns "null", "&lt;UNKNOWN&gt;" and "" into None, then ask for the time.</text>

  <g stroke="#374151" stroke-width="2">
    <line x1="255" y1="92" x2="255" y2="111" marker-end="url(#arrow)"/>
    <line x1="685" y1="92" x2="685" y2="111" marker-end="url(#arrow)"/>
    <line x1="470" y1="274" x2="470" y2="297" marker-end="url(#arrow)"/>
  </g>
  <text x="470" y="390" text-anchor="middle" font-size="11" fill="#9CA3AF">Results from our test, 3 runs each, temperature 0.</text>
</svg>
