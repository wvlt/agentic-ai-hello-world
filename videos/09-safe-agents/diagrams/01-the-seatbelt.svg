<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#FFFFFF"/>

  <text x="520" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">The seatbelt: guardrails around the loop</text>
  <text x="520" y="60" text-anchor="middle" font-size="14" fill="#6B7280">Working agent inside. Stops and checks outside.</text>

  <!-- Outer seatbelt ring -->
  <rect x="40" y="84" width="960" height="400" rx="28" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="12 8"/>
  <rect x="380" y="96" width="280" height="30" rx="15" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="520" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#4B5563">GUARDRAILS (the seatbelt)</text>

  <!-- Inner agent core -->
  <rect x="280" y="200" width="480" height="160" rx="20" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>
  <text x="520" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Agent loop</text>
  <text x="520" y="278" text-anchor="middle" font-size="14" fill="#374151">LLM  |  tools  |  memory  |  repeat</text>
  <text x="520" y="310" text-anchor="middle" font-size="13" fill="#92400E">from Video 08 - still the core</text>
  <text x="520" y="336" text-anchor="middle" font-size="12" fill="#6B7280">ask -> maybe tools -> save -> ask again</text>

  <!-- Guardrail chips around the ring -->
  <!-- top left -->
  <rect x="70" y="150" width="180" height="56" rx="12" fill="#FFF1EE" stroke="#FF3621" stroke-width="2.5"/>
  <text x="160" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">max_steps</text>
  <text x="160" y="192" text-anchor="middle" font-size="11" fill="#6B7280">no infinite loops</text>

  <!-- top right -->
  <rect x="790" y="150" width="180" height="56" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="880" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">token / time budget</text>
  <text x="880" y="192" text-anchor="middle" font-size="11" fill="#6B7280">cap the bill</text>

  <!-- mid left -->
  <rect x="70" y="250" width="180" height="56" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="160" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">errors as results</text>
  <text x="160" y="292" text-anchor="middle" font-size="11" fill="#6B7280">don't crash the loop</text>

  <!-- mid right -->
  <rect x="790" y="250" width="180" height="56" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="880" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">tool allow-list</text>
  <text x="880" y="292" text-anchor="middle" font-size="11" fill="#6B7280">only known tools</text>

  <!-- bottom left -->
  <rect x="70" y="350" width="180" height="56" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="160" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">truncation check</text>
  <text x="160" y="392" text-anchor="middle" font-size="11" fill="#6B7280">finish_reason=length</text>

  <!-- bottom right -->
  <rect x="790" y="350" width="180" height="56" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="2.5"/>
  <text x="880" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">read vs write</text>
  <text x="880" y="392" text-anchor="middle" font-size="11" fill="#6B7280">approve side effects</text>

  <!-- bottom center -->
  <rect x="380" y="400" width="280" height="56" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/>
  <text x="520" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">repeat detector</text>
  <text x="520" y="442" text-anchor="middle" font-size="11" fill="#6B7280">same tool + args -> stop</text>

  <text x="520" y="520" text-anchor="middle" font-size="14" fill="#374151">Prompting helps. Code seatbelts are what you trust.</text>
  <text x="520" y="546" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">An agent that cannot quietly run away.</text>
</svg>
