<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="1040" height="540" fill="#FFFFFF"/>

  <text x="520" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Design choices in our loop</text>
  <text x="520" y="58" text-anchor="middle" font-size="14" fill="#6B7280">Same agent. Safer defaults. Video 09 adds more guardrails.</text>

  <!-- Column labels -->
  <text x="60" y="94" font-size="12" font-weight="bold" letter-spacing="0.08em" fill="#9CA3AF">CHOICE</text>
  <text x="340" y="94" font-size="12" font-weight="bold" letter-spacing="0.08em" fill="#EF4444">TUTORIAL STYLE</text>
  <text x="720" y="94" font-size="12" font-weight="bold" letter-spacing="0.08em" fill="#10B981">OUR STYLE</text>

  <!-- ROW 1 -->
  <rect x="28" y="110" width="984" height="116" rx="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="72" cy="168" r="22" fill="#F59E0B"/>
  <text x="72" y="174" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="108" y="160" font-size="17" font-weight="bold" fill="#111827">Loop shape</text>
  <text x="108" y="182" font-size="13" fill="#6B7280">how it stops</text>

  <rect x="280" y="132" width="300" height="72" rx="12" fill="#FFFFFF" stroke="#FECACA" stroke-width="2"/>
  <text x="430" y="164" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" fill="#B91C1C">while True:</text>
  <text x="430" y="186" text-anchor="middle" font-size="12" fill="#9CA3AF">can run forever</text>

  <circle cx="610" cy="168" r="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <text x="610" y="173" text-anchor="middle" font-size="14" fill="#6B7280">→</text>

  <rect x="650" y="132" width="340" height="72" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
  <text x="820" y="164" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#047857">for step in range(max_steps)</text>
  <text x="820" y="186" text-anchor="middle" font-size="12" fill="#6B7280">hard stop — first guardrail</text>

  <!-- ROW 2 -->
  <rect x="28" y="244" width="984" height="116" rx="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <circle cx="72" cy="302" r="22" fill="#3B82F6"/>
  <text x="72" y="308" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="108" y="294" font-size="17" font-weight="bold" fill="#111827">Done check</text>
  <text x="108" y="316" font-size="13" fill="#6B7280">when to return</text>

  <rect x="280" y="266" width="300" height="72" rx="12" fill="#FFFFFF" stroke="#FECACA" stroke-width="2"/>
  <text x="430" y="294" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#B91C1C">finish_reason == "tool_calls"</text>
  <text x="430" y="316" text-anchor="middle" font-size="12" fill="#9CA3AF">misses truncated replies</text>

  <circle cx="610" cy="302" r="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <text x="610" y="307" text-anchor="middle" font-size="14" fill="#6B7280">→</text>

  <rect x="650" y="266" width="340" height="72" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
  <text x="820" y="294" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#047857">if not msg.tool_calls</text>
  <text x="820" y="316" text-anchor="middle" font-size="12" fill="#6B7280">checks what was actually returned</text>

  <!-- ROW 3 -->
  <rect x="28" y="378" width="984" height="116" rx="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <circle cx="72" cy="436" r="22" fill="#10B981"/>
  <text x="72" y="442" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="108" y="428" font-size="17" font-weight="bold" fill="#111827">Tool routing</text>
  <text x="108" y="450" font-size="13" fill="#6B7280">which function</text>

  <rect x="280" y="400" width="300" height="72" rx="12" fill="#FFFFFF" stroke="#FECACA" stroke-width="2"/>
  <text x="430" y="428" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" fill="#B91C1C">get_weather(city=...)</text>
  <text x="430" y="450" text-anchor="middle" font-size="12" fill="#9CA3AF">hard-codes one tool</text>

  <circle cx="610" cy="436" r="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <text x="610" y="441" text-anchor="middle" font-size="14" fill="#6B7280">→</text>

  <rect x="650" y="400" width="340" height="72" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
  <text x="820" y="428" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#047857">TOOLS[name](**args)</text>
  <text x="820" y="450" text-anchor="middle" font-size="12" fill="#6B7280">model picks any tool on the menu</text>

  <text x="520" y="524" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Write the loop once. Make the safe choice the default.</text>
</svg>
