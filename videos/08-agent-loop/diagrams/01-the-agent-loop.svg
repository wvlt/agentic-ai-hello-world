<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="#FFFFFF"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">The agent loop</text>
  <text x="450" y="58" text-anchor="middle" font-size="14" fill="#6B7280">LLM + tools + loop + memory = agent</text>

  <!-- Start -->
  <rect x="320" y="78" width="260" height="48" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
  <text x="450" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">1. Ask the model</text>

  <!-- Decision -->
  <path d="M450 150 L560 210 L450 270 L340 210 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>
  <text x="450" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">tool_calls?</text>
  <text x="450" y="225" text-anchor="middle" font-size="12" fill="#6B7280">empty?</text>

  <!-- Yes branch: run tools -->
  <rect x="620" y="186" width="240" height="56" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <text x="740" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">2. Run every tool</text>
  <text x="740" y="228" text-anchor="middle" font-size="12" fill="#374151">save results in memory</text>

  <!-- Loop back -->
  <text x="740" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#F59E0B">3. Ask again</text>

  <!-- No branch: done -->
  <rect x="320" y="320" width="260" height="48" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/>
  <text x="450" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Return the answer</text>

  <!-- Step limit callout -->
  <rect x="60" y="186" width="220" height="56" rx="10" fill="#FFF1EE" stroke="#FF3621" stroke-width="2"/>
  <text x="170" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">max_steps reached?</text>
  <text x="170" y="228" text-anchor="middle" font-size="12" fill="#374151">stop - don't loop forever</text>

  <!-- Arrows -->
  <g stroke="#374151" stroke-width="2.5" fill="none">
    <line x1="450" y1="126" x2="450" y2="150" marker-end="url(#arrow)"/>
    <line x1="560" y1="210" x2="616" y2="210" marker-end="url(#arrow)"/>
    <path d="M740 186 V140 H450 V126" marker-end="url(#arrow)"/>
    <line x1="450" y1="270" x2="450" y2="316" marker-end="url(#arrow)"/>
    <line x1="340" y1="210" x2="284" y2="210" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#374151">
    <text x="590" y="200" text-anchor="middle">yes</text>
    <text x="465" y="300">no</text>
  </g>

  <text x="450" y="420" text-anchor="middle" font-size="15" fill="#111827">Memory is the message list. Tools are your functions.</text>
  <text x="450" y="448" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">The loop is what makes it an agent.</text>
</svg>
