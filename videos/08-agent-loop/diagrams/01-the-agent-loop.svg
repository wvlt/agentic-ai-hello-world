<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="1000" height="580" fill="#FFFFFF"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">The agent loop</text>
  <text x="500" y="58" text-anchor="middle" font-size="14" fill="#6B7280">LLM + tools + loop + memory  =  agent</text>

  <!-- Soft stage -->
  <rect x="40" y="78" width="920" height="420" rx="28" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2" stroke-dasharray="12 9"/>
  <rect x="300" y="90" width="400" height="28" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="500" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">repeat until done  ·  max_steps is the seatbelt</text>

  <!-- STEP 1 -->
  <rect x="70" y="140" width="250" height="130" rx="16" fill="#FFFFFF" stroke="#FF3621" stroke-width="3"/>
  <circle cx="102" cy="172" r="18" fill="#FF3621"/>
  <text x="102" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="195" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Ask the model</text>
  <text x="195" y="210" text-anchor="middle" font-size="13" fill="#374151">messages + tool menu</text>
  <rect x="90" y="228" width="210" height="26" rx="6" fill="#FFF1EE"/>
  <text x="195" y="246" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#9F1239">create(model, messages, tools)</text>

  <!-- Arrow 1 → 2 -->
  <line x1="320" y1="205" x2="364" y2="205" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- STEP 2 -->
  <rect x="370" y="140" width="260" height="130" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="402" cy="172" r="18" fill="#F59E0B"/>
  <text x="402" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="500" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Want tools?</text>
  <text x="500" y="210" text-anchor="middle" font-size="13" fill="#374151">check msg.tool_calls</text>
  <rect x="392" y="228" width="216" height="26" rx="6" fill="#FFFBEB"/>
  <text x="500" y="246" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#92400E">if not tool_calls: return</text>

  <!-- yes → 3 -->
  <line x1="630" y1="205" x2="674" y2="205" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="652" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">yes</text>

  <!-- STEP 3 -->
  <rect x="680" y="140" width="250" height="130" rx="16" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
  <circle cx="712" cy="172" r="18" fill="#10B981"/>
  <text x="712" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="805" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Run every tool</text>
  <text x="805" y="210" text-anchor="middle" font-size="13" fill="#374151">golden rules 1–4</text>
  <rect x="700" y="228" width="210" height="26" rx="6" fill="#ECFDF5"/>
  <text x="805" y="246" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#065F46">add_tool_results(...)</text>

  <!-- no → final answer (right side exit) -->
  <path d="M500 270 V300 H580" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="520" y="292" font-size="12" font-weight="bold" fill="#1D4ED8">no</text>

  <!-- FINAL ANSWER box -->
  <rect x="580" y="288" width="200" height="44" rx="12" fill="#1D4ED8"/>
  <text x="680" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Final answer ✓</text>

  <!-- from step 3 down to memory -->
  <path d="M805 270 V348" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- STEP 4 memory -->
  <rect x="70" y="348" width="860" height="118" rx="16" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3"/>
  <circle cx="102" cy="380" r="18" fill="#3B82F6"/>
  <text x="102" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="130" y="380" font-size="16" font-weight="bold" fill="#111827">Save results in memory</text>
  <text x="130" y="400" font-size="13" fill="#6B7280">the message list grows — then ask again</text>

  <!-- memory chips -->
  <g font-size="11" font-family="Menlo, Consolas, monospace">
    <rect x="100" y="420" width="72" height="28" rx="7" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/><text x="136" y="438" text-anchor="middle" fill="#111827">system</text>
    <rect x="180" y="420" width="56" height="28" rx="7" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/><text x="208" y="438" text-anchor="middle" fill="#111827">user</text>
    <rect x="244" y="420" width="96" height="28" rx="7" fill="#FFF1EE" stroke="#FF3621" stroke-width="1.5"/><text x="292" y="438" text-anchor="middle" fill="#111827">tool_calls</text>
    <rect x="348" y="420" width="56" height="28" rx="7" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><text x="376" y="438" text-anchor="middle" fill="#111827">tool</text>
    <rect x="412" y="420" width="96" height="28" rx="7" fill="#FFF1EE" stroke="#FF3621" stroke-width="1.5"/><text x="460" y="438" text-anchor="middle" fill="#111827">tool_calls</text>
    <rect x="516" y="420" width="56" height="28" rx="7" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/><text x="544" y="438" text-anchor="middle" fill="#111827">tool</text>
    <rect x="580" y="420" width="72" height="28" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><text x="616" y="438" text-anchor="middle" fill="#1E3A8A">answer</text>
    <text x="680" y="438" fill="#9CA3AF" font-family="Helvetica, Arial, sans-serif">… until empty</text>
  </g>

  <!-- loop back arrow -->
  <path d="M90 348 V300 H195 V270" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <rect x="108" y="302" width="52" height="20" rx="6" fill="#F59E0B"/>
  <text x="134" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">LOOP</text>

  <text x="500" y="528" text-anchor="middle" font-size="14" fill="#374151">Frameworks are this loop with extras. You just wrote the core.</text>
  <text x="500" y="556" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Keep going until the model is done — or you hit max_steps.</text>
</svg>
