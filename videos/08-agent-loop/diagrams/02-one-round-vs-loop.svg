<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="1040" height="560" fill="#FFFFFF"/>

  <text x="520" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">One round vs a loop</text>
  <text x="520" y="58" text-anchor="middle" font-size="14" fill="#6B7280">Same question:  “What's the weather in Perth and in Tokyo?”</text>

  <!-- LEFT -->
  <rect x="28" y="78" width="480" height="420" rx="20" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
  <rect x="28" y="78" width="480" height="52" rx="20" fill="#FEE2E2"/>
  <rect x="28" y="110" width="480" height="20" fill="#FEE2E2"/>
  <text x="268" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#991B1B">One hand-written round</text>
  <text x="268" y="156" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="0.06em" fill="#9CA3AF">CONVERSATION STOPS EARLY</text>

  <!-- chips left -->
  <g>
    <rect x="52" y="174" width="432" height="40" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="52" y="174" width="70" height="40" rx="10" fill="#3B82F6"/>
    <text x="87" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">user</text>
    <text x="136" y="199" font-size="13" fill="#111827">Perth and Tokyo weather?</text>

    <rect x="52" y="226" width="432" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <rect x="52" y="226" width="70" height="40" rx="10" fill="#FF3621"/>
    <text x="87" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">LLM</text>
    <text x="136" y="251" font-size="13" fill="#111827">tool_call: get_weather("Perth")</text>

    <rect x="52" y="278" width="432" height="40" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
    <rect x="52" y="278" width="70" height="40" rx="10" fill="#10B981"/>
    <text x="87" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">you</text>
    <text x="136" y="303" font-size="13" fill="#111827">tool result: "sunny, 31C"</text>

    <rect x="52" y="330" width="432" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <rect x="52" y="330" width="70" height="40" rx="10" fill="#FF3621"/>
    <text x="87" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">LLM</text>
    <text x="136" y="355" font-size="13" fill="#111827">tool_call: get_weather("Tokyo")</text>

    <rect x="52" y="390" width="432" height="70" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="268" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#B91C1C">Still not done.</text>
    <text x="268" y="442" text-anchor="middle" font-size="13" fill="#7F1D1D">No final answer — another tool_call.</text>
  </g>
  <text x="268" y="480" text-anchor="middle" font-size="12" fill="#6B7280">Llama often asks one city per reply.</text>

  <!-- RIGHT -->
  <rect x="532" y="78" width="480" height="420" rx="20" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
  <rect x="532" y="78" width="480" height="52" rx="20" fill="#D1FAE5"/>
  <rect x="532" y="110" width="480" height="20" fill="#D1FAE5"/>
  <text x="772" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#065F46">The agent loop</text>
  <text x="772" y="156" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="0.06em" fill="#9CA3AF">SAME STEPS — KEEP GOING</text>

  <g>
    <rect x="556" y="174" width="432" height="36" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="556" y="174" width="70" height="36" rx="10" fill="#3B82F6"/>
    <text x="591" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">user</text>
    <text x="640" y="197" font-size="13" fill="#111827">Perth and Tokyo weather?</text>

    <rect x="556" y="220" width="432" height="36" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <rect x="556" y="220" width="70" height="36" rx="10" fill="#FF3621"/>
    <text x="591" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">LLM</text>
    <text x="640" y="243" font-size="13" fill="#111827">tool_call: get_weather("Perth")</text>

    <rect x="556" y="266" width="432" height="36" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
    <rect x="556" y="266" width="70" height="36" rx="10" fill="#10B981"/>
    <text x="591" y="289" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">you</text>
    <text x="640" y="289" font-size="13" fill="#111827">tool result  →  ask again</text>

    <rect x="556" y="312" width="432" height="36" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <rect x="556" y="312" width="70" height="36" rx="10" fill="#FF3621"/>
    <text x="591" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">LLM</text>
    <text x="640" y="335" font-size="13" fill="#111827">tool_call: get_weather("Tokyo")</text>

    <rect x="556" y="358" width="432" height="36" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="2"/>
    <rect x="556" y="358" width="70" height="36" rx="10" fill="#10B981"/>
    <text x="591" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">you</text>
    <text x="640" y="381" font-size="13" fill="#111827">tool result  →  ask again</text>

    <rect x="556" y="414" width="432" height="52" rx="12" fill="#047857"/>
    <text x="772" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Final answer</text>
    <text x="772" y="456" text-anchor="middle" font-size="13" fill="#A7F3D0">Perth sunny, 31C · Tokyo cloudy, 18C</text>
  </g>

  <text x="520" y="532" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Don't assume one round. Keep going until tool_calls is empty.</text>
</svg>
